{% load has_group %}

<div class="container">
    <header class="d-flex justify-content-center py-3">
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="/mailing/" class="nav-link {% if not active_menu  %} active {% endif %} " aria-current="page">Рассылки</a></li>
        <li class="nav-item"><a href="/mailing/client/" class="nav-link {% if active_menu == 'client' %} active {% endif %}">Клиенты</a></li>
        <li class="nav-item"><a href="/mailing/message/" class="nav-link {% if active_menu == 'messages' %} active {% endif %}">Тексты</a></li>
        <li class="nav-item"><a href="/mailing/task/" class="nav-link {% if active_menu == 'task' %} active {% endif %}">Планировка рассылок</a></li>
        {% if  request.user|has_group:"Модератор" %}
          <li class="nav-item"><a href="{% url 'mailing:moderation_tasks' %}"  class="nav-link {% if active_menu == 'moderation' %} active {% endif %}">Модерация</a></li>
          {% endif %}
          {% if not user.is_authenticated %}
            <li class="nav-item"><a href="{% url 'users:login' %}" class="nav-link ">Войти</a></li>
          <li class="nav-item"><a href="{% url 'users:signup' %}" class="nav-link ">Регистрация</a></li>
          {% else %}

          <form method="post" action="{% url 'users:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-link dropdown-item">Выход</button>
                    </form>
          {% endif %}

      </ul>
    </header>
  </div>
