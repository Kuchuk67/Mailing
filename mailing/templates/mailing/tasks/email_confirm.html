{% extends 'base.html' %}
{% block content %}
{% load static %}
{% include 'menu.html' %}

<div class="p-4">
<div> ID: {{ task.pk }}  </div>
  <div>  <b>{{ task.name }}</b> </div>
<div>  {{ task.get_status_display }} </div>
<div>Комментарий: {{ task.description }} </div>
</div>


<div class="p-4">
    <form method="POST">
                    {% csrf_token %}
                 <p style="color: red">Точно хотите удалить все адреса в рассылке: <b>{{ task.name }} </b></p>

                <button type="submit" class="btn btn-primary">Удалить</button>
                <a href="{% url 'mailing:tasks' %}" class="btn btn-secondary">Отмена</a>
    </form>

</div>

{% endblock %}
