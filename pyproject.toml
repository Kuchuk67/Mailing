[tool.poetry]
name = "mailing"
version = "0.1.0"
description = ""
authors = ["Serg Kuchukov Office <kuchukov.sergey@gmail.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.5"
python-dotenv = "^1.0.1"
django-ckeditor-5 = "^0.2.15"
psycopg2 = "^2.9.10"
flake8 = "^7.1.2"

[tool.poetry.group.link.dependencies]
black = "^25.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
     /(
            \.eggs  # Исключить несколько общих
         | \.git # в корне проекта
          | \.hg
          | \.mypy_cache
          | \.tox
          | \.venv
          | dist
          )/
          | foo.py           # Также отдельно исключить файл с именем foo.py
# в корне проекта
)
'''